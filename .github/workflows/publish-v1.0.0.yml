name: Publish Teya Payments for VirtueMart v1.0.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.0.0.yml]

permissions:
  contents: write

concurrency:
  group: virtuemart-release-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'webensol/teya-payments-for-joomla-virtuemart' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: '436630444'
      RELEASE_COMMIT: f08e9136c3994030772e555fb40b68bdcf22dff8
      TAG: v1.0.0
      PACKAGE: pkg_teya_virtuemart-1.0.0.zip
    steps:
      - name: Verify and publish the reviewed release
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/tarball/$RELEASE_COMMIT" > source.tar.gz
          mkdir source
          tar -xzf source.tar.gz --strip-components=1 -C source
          cd source
          make package-virtuemart

          release_endpoint="repos/$GH_REPO/releases/$RELEASE_ID"
          gh api "$release_endpoint" > "$RUNNER_TEMP/virtuemart-release.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          release = json.loads(Path(os.environ["RUNNER_TEMP"], "virtuemart-release.json").read_text())
          assert release["tag_name"] == os.environ["TAG"] and not release["prerelease"]
          assert release["target_commitish"] == os.environ["RELEASE_COMMIT"]
          assert release["name"] == "Teya Payments for VirtueMart 1.0.0"
          assert release["body"].strip() == Path("docs/RELEASE-NOTES.md").read_text().strip()

          package = Path("dist", os.environ["PACKAGE"])
          checksum = package.with_suffix(".zip.sha256")
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          assert checksum.read_text() == f"{digest}  {package.name}\n"
          assert ElementTree.parse("updates/virtuemart-1.0.0.xml").findtext("update/sha256") == digest
          assets = {asset["name"]: asset for asset in release["assets"]}
          assert assets.keys() == {package.name, checksum.name}
          for path in (package, checksum):
              asset = assets[path.name]
              assert asset["state"] == "uploaded"
              assert asset["digest"] == "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          PY

          current_tag="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" \
            --jq '.[] | select(.ref == "refs/tags/v1.0.0") | .object.sha')"
          test -z "$current_tag" || test "$current_tag" = "$RELEASE_COMMIT"
          if [[ "$(jq -r .draft "$RUNNER_TEMP/virtuemart-release.json")" = true ]]; then
            gh api --method PATCH "$release_endpoint" -F draft=false -F prerelease=false -f make_latest=true \
              --jq '{url:.html_url,tag:.tag_name,draft:.draft,prerelease:.prerelease}'
          fi
          gh api "$release_endpoint" --jq '.draft == false and .prerelease == false' | grep -qx true
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$RELEASE_COMMIT"
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" = "$TAG"
