name: Publish Teya Payments for VirtueMart v1.0.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.0.1.yml]

permissions:
  contents: write

concurrency:
  group: virtuemart-release-v1.0.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'webensol/teya-payments-for-joomla-virtuemart' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: 9c27169b1691e2b463167e5a971cf29946abae2b
      TAG: v1.0.1
      PACKAGE: pkg_teya_virtuemart-1.0.1.zip
      EXPECTED_SHA256: 5d1b66f988cef7ae9be25f2a0ae20f7524b59e8c79448d4cf7d503c311342b34
    steps:
      - name: Build and publish the verified package
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/tarball/$RELEASE_COMMIT" > source.tar.gz
          mkdir source
          tar -xzf source.tar.gz --strip-components=1 -C source
          cd source
          make package-virtuemart
          printf '%s  %s\n' "$EXPECTED_SHA256" "dist/$PACKAGE" | sha256sum --check -

          release_id="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "v1.0.1") | .id')"
          if [[ -z "$release_id" ]]; then
            python3 - <<'PY' > "$RUNNER_TEMP/virtuemart-create.json"
          import json
          import os
          from pathlib import Path

          print(json.dumps({
              "tag_name": os.environ["TAG"],
              "target_commitish": os.environ["RELEASE_COMMIT"],
              "name": "Teya Payments for VirtueMart 1.0.1",
              "body": Path("docs/RELEASE-NOTES.md").read_text(),
              "draft": True,
              "prerelease": False,
          }))
          PY
            release_id="$(gh api --method POST "repos/$GH_REPO/releases" \
              --input "$RUNNER_TEMP/virtuemart-create.json" --jq '.id')"
          fi
          [[ "$release_id" =~ ^[0-9]+$ ]]
          endpoint="repos/$GH_REPO/releases/$release_id"
          gh api "$endpoint" > "$RUNNER_TEMP/virtuemart-release.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path(os.environ["RUNNER_TEMP"], "virtuemart-release.json").read_text())
          assert release["tag_name"] == os.environ["TAG"] and not release["prerelease"]
          assert release["target_commitish"] == os.environ["RELEASE_COMMIT"]
          assert release["name"] == "Teya Payments for VirtueMart 1.0.1"
          assert release["body"].strip() == Path("docs/RELEASE-NOTES.md").read_text().strip()
          PY

          for name in "$PACKAGE" "$PACKAGE.sha256"; do
            if ! jq -e --arg name "$name" 'any(.assets[]; .name == $name)' "$RUNNER_TEMP/virtuemart-release.json" > /dev/null; then
              jq -e '.draft == true' "$RUNNER_TEMP/virtuemart-release.json" > /dev/null
              gh api --method POST \
                "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=$name" \
                -H 'Content-Type: application/octet-stream' --input "dist/$name" > /dev/null
            fi
          done
          gh api "$endpoint" > "$RUNNER_TEMP/virtuemart-release.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          release = json.loads(Path(os.environ["RUNNER_TEMP"], "virtuemart-release.json").read_text())
          package = Path("dist", os.environ["PACKAGE"])
          checksum = package.with_suffix(".zip.sha256")
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          assert digest == os.environ["EXPECTED_SHA256"]
          assert checksum.read_text() == f"{digest}  {package.name}\n"
          assets = {asset["name"]: asset for asset in release["assets"]}
          assert assets.keys() == {package.name, checksum.name}
          for path in (package, checksum):
              asset = assets[path.name]
              assert asset["state"] == "uploaded" and asset["size"] == path.stat().st_size
              assert asset["digest"] == "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          PY
          if [[ "$(jq -r .draft "$RUNNER_TEMP/virtuemart-release.json")" = true ]]; then
            gh api --method PATCH "$endpoint" -F draft=false -F prerelease=false -f make_latest=true \
              --jq '{url:.html_url,tag:.tag_name,draft:.draft,prerelease:.prerelease}'
          fi
          gh api "$endpoint" --jq '.draft == false and .prerelease == false' | grep -qx true
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$RELEASE_COMMIT"
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" = "$TAG"
