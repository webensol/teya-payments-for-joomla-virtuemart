name: Publish Teya Payments for VirtueMart v1.0.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.0.2.yml]

permissions:
  contents: write

concurrency:
  group: virtuemart-release-v1.0.2
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'webensol/teya-payments-for-joomla-virtuemart' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: 6a9e897bed8dbc9b543a50d19ea15268141d4ac7
      TAG: v1.0.2
      PACKAGE: pkg_teya_virtuemart-1.0.2.zip
      EXPECTED_SHA256: a009806b70510d2b00930bfe83e1c48c76cbd229e36f4c306e59aaf18507f048
    steps:
      - name: Build and publish the verified release
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/tarball/$RELEASE_COMMIT" > source.tar.gz
          mkdir source
          tar -xzf source.tar.gz --strip-components=1 -C source
          cd source
          make package-virtuemart
          printf '%s  %s\n' "$EXPECTED_SHA256" "dist/$PACKAGE" | sha256sum --check -

          release_id="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "v1.0.2") | .id')"
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$RELEASE_COMMIT"

          if [[ -z "$release_id" ]]; then
            python3 - <<'PY' > "$RUNNER_TEMP/create-release.json"
          import json
          import os
          from pathlib import Path

          print(json.dumps({
              "tag_name": os.environ["TAG"],
              "target_commitish": "main",
              "name": "Teya Payments for VirtueMart 1.0.2",
              "body": Path("docs/RELEASE-NOTES.md").read_text(),
              "draft": True,
              "prerelease": False,
          }))
          PY
            if ! gh api --method POST "repos/$GH_REPO/releases" \
              --input "$RUNNER_TEMP/create-release.json" > "$RUNNER_TEMP/create-response.json"; then
              cat "$RUNNER_TEMP/create-response.json"
              exit 1
            fi
            release_id="$(jq -r .id "$RUNNER_TEMP/create-response.json")"
          fi
          [[ "$release_id" =~ ^[0-9]+$ ]]
          endpoint="repos/$GH_REPO/releases/$release_id"
          gh api "$endpoint" > "$RUNNER_TEMP/replacement-release.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path(os.environ["RUNNER_TEMP"], "replacement-release.json").read_text())
          assert release["tag_name"] == os.environ["TAG"] and not release["prerelease"]
          assert release["target_commitish"] == "main"
          assert release["body"].strip() == Path("docs/RELEASE-NOTES.md").read_text().strip()
          PY
          for name in "$PACKAGE" "$PACKAGE.sha256"; do
            if ! jq -e --arg name "$name" 'any(.assets[]; .name == $name)' "$RUNNER_TEMP/replacement-release.json" > /dev/null; then
              jq -e '.draft == true' "$RUNNER_TEMP/replacement-release.json" > /dev/null
              gh api --method POST \
                "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=$name" \
                -H 'Content-Type: application/octet-stream' --input "dist/$name" > /dev/null
            fi
          done
          gh api "$endpoint" > "$RUNNER_TEMP/replacement-release.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          release = json.loads(Path(os.environ["RUNNER_TEMP"], "replacement-release.json").read_text())
          package = Path("dist", os.environ["PACKAGE"])
          checksum = package.with_suffix(".zip.sha256")
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          assert digest == os.environ["EXPECTED_SHA256"]
          assert checksum.read_text() == f"{digest}  {package.name}\n"
          assets = {asset["name"]: asset for asset in release["assets"]}
          assert assets.keys() == {package.name, checksum.name}
          for path in (package, checksum):
              asset = assets[path.name]
              assert asset["state"] == "uploaded" and asset["size"] == path.stat().st_size
              assert asset["digest"] == "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          PY
          if [[ "$(jq -r .draft "$RUNNER_TEMP/replacement-release.json")" = true ]]; then
            gh api --method PATCH "$endpoint" -F draft=false -F prerelease=false -f make_latest=true \
              --jq '{id:.id,url:.html_url,tag:.tag_name,draft:.draft}'
          fi
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$RELEASE_COMMIT"
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" = "$TAG"
